# Bio paragraphs on the home page. Markdown is supported.
bio:
  - >-
    I am a graduate of the M.Sc. program in Computer Science at
    [Sharif University of Technology](https://sharif.edu/), where I studied theory of deep learning 
    and worked as a research assistant in the Robust and
    Interpretable Machine Learning (RIML) Lab.
  - >-
    I study the theory of deep learning: why heavily overparameterized networks
    generalize, how implicit regularization shapes the solutions they find, and
    what these phenomena imply for robustness and representation learning.
  - >-

