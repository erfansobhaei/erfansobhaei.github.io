<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="A bird in flight, after the waterbirds setting">
  <!-- Shared palette: #2B2622 ink, #5C544A dark, #968C7E mid, #CEC4B2 light, #F2ECE2 bone -->
  <defs>
    <radialGradient id="vig" cx="50%" cy="46%" r="72%">
      <stop offset="55%" stop-color="#241f1b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#241f1b" stop-opacity="0.30"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.55"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="200" height="200" fill="#F2ECE2"/>
  <rect y="128" width="200" height="72" fill="#CEC4B2" opacity="0.7"/>

  <!-- motion arcs -->
  <g fill="none" stroke="#968C7E" stroke-width="3.5" stroke-linecap="round" opacity="0.8">
    <path d="M28 62 C 44 54, 60 54, 74 60"/>
    <path d="M22 84 C 42 74, 62 74, 80 82"/>
  </g>

  <!-- the bird -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 78 C 84 60, 62 52, 44 56 C 60 72, 78 82, 100 88 Z" fill="#5C544A"/>
    <path d="M100 78 C 116 60, 138 52, 156 56 C 140 72, 122 82, 100 88 Z" fill="#2B2622"/>
    <ellipse cx="100" cy="94" rx="15" ry="20" fill="#5C544A" transform="rotate(8 100 94)"/>
    <path d="M108 76 L124 72 L110 84 Z" fill="#CEC4B2"/>
    <circle cx="106" cy="80" r="2.6" fill="#F2ECE2"/>
    <path d="M92 112 L100 126 L108 112" fill="none" stroke="#5C544A" stroke-width="4"/>
  </g>

  <rect width="200" height="200" fill="url(#vig)"/>
  <rect width="200" height="200" fill="#2B2622" filter="url(#grain)" opacity="0.22"/>
</svg>
