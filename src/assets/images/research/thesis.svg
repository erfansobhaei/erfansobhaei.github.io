<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Neural collapse: features gathering on the vertices of a simplex">
  <!-- Shared palette: #2B2622 ink, #5C544A dark, #968C7E mid, #CEC4B2 light, #F2ECE2 bone -->
  <defs>
    <radialGradient id="vig" cx="50%" cy="46%" r="72%">
      <stop offset="55%" stop-color="#241f1b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#241f1b" stop-opacity="0.30"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.55"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="200" height="200" fill="#F2ECE2"/>

  <!-- simplex outline -->
  <path d="M101 30 L171 152 L31 152 Z" fill="none" stroke="#5C544A" stroke-width="5"
        stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>

  <!-- features drifting outward to the vertices -->
  <g stroke="#CEC4B2" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M104 108 L112 62"/>
    <path d="M96 108 L74 132"/>
    <path d="M104 110 L142 136"/>
  </g>

  <!-- collapsed clusters at the vertices -->
  <g fill="#2B2622">
    <circle cx="101" cy="34" r="11"/>
    <circle cx="169" cy="150" r="11"/>
    <circle cx="33" cy="150" r="11"/>
  </g>

  <!-- still-dispersed points in the middle -->
  <g fill="#968C7E">
    <circle cx="92" cy="104" r="6"/>
    <circle cx="106" cy="112" r="6"/>
    <circle cx="99" cy="120" r="6"/>
    <circle cx="111" cy="99" r="5"/>
    <circle cx="88" cy="115" r="5"/>
  </g>

  <rect width="200" height="200" fill="url(#vig)"/>
  <rect width="200" height="200" fill="#2B2622" filter="url(#grain)" opacity="0.22"/>
</svg>
