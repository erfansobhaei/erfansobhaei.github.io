repos:
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.12.0
    hooks:
      - id: eslint
        files: "\\.(js|mjs|cjs|css|json|yml|yaml|md|html)$"
        additional_dependencies:
          - eslint@^9.32.0
          - "@eslint/js@^9.32.0"
          - "@eslint/css"
          - "@eslint/json"
          - "@eslint/markdown"
          - "@html-eslint/eslint-plugin"
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: "\\.(js|mjs|cjs|css|json|yml|yaml|md|njk|html)$"
        additional_dependencies:
          - prettier@v4.0.0-alpha.8
          - "prettier-plugin-toml@2.0.1"
